name: Build DanClick EXE

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EXE
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --onefile --windowed --name DanClick windows/danclick.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DanClick-Windows
          path: dist/DanClick.exe
