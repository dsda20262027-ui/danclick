<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanClick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>DanClick</h1>
    <p class="subtitle">Кликай и набирай очки!</p>
    <div id="score" class="score">0</div>
    <button id="clickButton" class="click-button">КЛИК!</button>
    <div class="stats">
      <span>Кликов: <b id="clicks">0</b></span>
      <span>Рекорд: <b id="best">0</b></span>
    </div>
    <button id="resetButton" class="reset-button">Сбросить</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
